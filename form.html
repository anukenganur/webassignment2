<!DOCTYPE html>
<html>
<head>
    <title>Online Application Form</title>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>
        body {
            font-family: Arial;
            background-color: #eef2f3;
            padding: 30px;
        }

        .form-container {
            background: white;
            padding: 30px;
            width: 350px;
            margin: auto;
            border-radius: 8px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
        }

        input, select, textarea {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            font-family: inherit;
        }

        textarea {
            resize: vertical;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: green;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="form-container">

    <h2>Course Application Form</h2>

    <form id="registrationForm">

        <div class="form-group">
            <label>Full Name:</label>
            <input type="text" name="fullName" required>
        </div>

        <div class="form-group">
            <label>USN:</label>
            <input type="text" name="usn" placeholder="e.g., 1SK21CS001" required>
        </div>

        <div class="form-group">
            <label>Email:</label>
            <input type="email" name="email" required>
        </div>

        <div class="form-group">
            <label>Phone Number:</label>
            <input type="tel" name="phone" pattern="[0-9]{10}" placeholder="10-digit phone number" required>
        </div>

        <div class="form-group">
            <label>Date of Birth:</label>
            <input type="date" name="dob" required>
        </div>

        <div class="form-group">
            <label>Address:</label>
            <textarea name="address" rows="3" placeholder="Enter full address" required></textarea>
        </div>

        <div class="form-group">
            <label>Course Track:</label>
            <select name="course">
                <option>Web Development</option>
                <option>Data Science</option>
            </select>
        </div>

        <button type="submit">Submit Application</button>

    </form>

    <div id="resultContainer"></div>

</div>

<script>
$(document).ready(function() {

    $('#registrationForm').submit(function(e) {
        e.preventDefault();

        $.ajax({
            url: 'process.php',
            type: 'POST',
            data: $(this).serialize(),

            success: function(response) {
                $('#resultContainer').html(response);
            }
        });
    });

});
</script>

</body>
</html>
